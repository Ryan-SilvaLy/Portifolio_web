<div class=\"skills-container\">\n  <h2 class=\"skills-title\">Habilidades & Tecnologias</h2>\n\n  <div class=\"skills-grid\">\n    <!-- Frontend -->\n    <div class=\"skills-category\">\n      <h3 class=\"category-title\">Frontend</h3>\n      <div class=\"skills-list\">\n        <div *ngFor=\"let skill of frontendSkills\" class=\"skill-card\">\n          <i [class]=\"skill.icon\" class=\"skill-icon\"></i>\n          <span class=\"skill-name\">{{ skill.name }}</span>\n        </div>\n      </div>\n    </div>\n\n    <!-- Backend -->\n    <div class=\"skills-category\">\n      <h3 class=\"category-title\">Backend</h3>\n      <div class=\"skills-list\">\n        <div *ngFor=\"let skill of backendSkills\" class=\"skill-card\">\n          <i [class]=\"skill.icon\" class=\"skill-icon\"></i>\n          <span class=\"skill-name\">{{ skill.name }}</span>\n        </div>\n      </div>\n    </div>\n\n    <!-- Tools -->\n    <div class=\"skills-category\">\n      <h3 class=\"category-title\">Tools & DevOps</h3>\n      <div class=\"skills-list\">\n        <div *ngFor=\"let skill of toolsSkills\" class=\"skill-card\">\n          <i [class]=\"skill.icon\" class=\"skill-icon\"></i>\n          <span class=\"skill-name\">{{ skill.name }}</span>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>
